default_language_version:
  python: python3.12

# experiments/ is staged research-only code (see #186): best-effort, destined for the
# EveryQueryExperiments repo, and not held to the core lint gate. This mirrors the
# `--ignore=experiments` pytest setting in pyproject.toml.
exclude: "^experiments/"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # list of supported hooks: https://pre-commit.com/hooks.html
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-docstring-first
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-toml
      - id: check-json
      - id: check-xml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb, "800"]

  # python code formatting, linting, and import sorting using ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.10
    hooks:
      # Run the formatter
      - id: ruff-format
      # Run the linter
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]

  # python docstring formatting
  - repo: https://github.com/myint/docformatter
    rev: v1.7.7
    hooks:
      - id: docformatter
        args: [--in-place, --wrap-summaries=110, --wrap-descriptions=110]

  # yaml formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types: [yaml]
        exclude: "environment.yaml"

  # shell scripts linter
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # md formatting
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        args: ["--number"]
        # Pin every plugin — otherwise fresh pre-commit envs (e.g. CI) resolve the
        # latest release at install time and silently produce different formatting
        # than stale local caches.  mdformat-shfmt in particular changes how it
        # indents bash inside fenced code blocks between versions.
        #
        # `shfmt-py` bundles the `shfmt` Go binary into the hook's venv bin dir so
        # mdformat-shfmt finds it via subprocess.run(["shfmt"]).  Without this,
        # mdformat-shfmt silently no-ops on machines lacking a system shfmt while
        # CI (Ubuntu runners have shfmt via apt) actively reformats — producing
        # local-pass / CI-fail drift on any markdown file with bash fenced blocks.
        additional_dependencies:
          - mdformat-ruff==0.1.3
          - mdformat-gfm==1.0.0
          - mdformat-gfm-alerts==2.0.0
          - mdformat-tables==1.0.0
          - mdformat_frontmatter==2.0.10
          - mdformat-black==0.1.1
          - mdformat-config==0.2.1
          - mdformat-shfmt==0.2.0
          - mdformat-mkdocs==5.1.4
          - mdformat-toc==0.5.0
          - shfmt-py==3.12.0.2

  # word spelling linter
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args:
          - --skip=*.ipynb,*.bib,*.svg,pyproject.toml
          - --ignore-words-list=ehr,crate

  # jupyter notebook cell output clearing
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  # jupyter notebook linting with ruff
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-ruff
        args: ["--fix", "--extend-ignore=E402"]
      - id: nbqa-ruff-format
        args: ["--line-length=110"]
