[build-system]
requires = ["setuptools>=80.9.0", "setuptools-scm>=9.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "EveryQuery"
dynamic = ["version"] # Makes setuptools-scm manage the version
authors = [
  {name="Payal Chandak", email="payal.chandak@gmail.com"},
  {name="Matthew McDermott", email="mattmcdermott8@gmail.com"},
  {name="Gregory Kondas", email="gregkondas9@gmail.com"},
]
description = "A framework for training and evaluating foundation models, using the MEDS ecosystem for data processing and PyTorch Lightning for training."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License", # Change if not using MIT license
    "Operating System :: OS Independent",
]
dependencies = [
  "polars~=1.30.0",
  "pyarrow==21.0.0",
  "hydra-core==1.3.2",
  "numpy==2.3.3",
  "meds==0.4.0",
  "filelock==3.19.1",
  "pytest==8.4.2",
  "meds-transforms==0.5.3",
  "meds-torch-data[lightning]~=0.6.3",
  "transformers==4.56.1",
  "torch==2.8.0",
  "torchmetrics==1.8.2",
  "lightning==2.5.5",
  "dotenv==0.9.9",
  "aiohappyeyeballs==2.6.1",
  "aiohttp==3.12.15",
  "aiosignal==1.4.0",
  "annotated-types==0.7.0",
  "antlr4-python3-runtime==4.9.3",
  "asttokens==3.0.0",
  "attrs==25.3.0",
  "certifi==2025.8.3",
  "charset-normalizer==3.4.3",
  "click==8.2.1",
  "decorator==5.2.1",
  "executing==2.2.1",
  "flexible-schema==0.1",
  "frozenlist==1.7.0",
  "fsspec==2025.9.0",
  "gitdb==4.0.12",
  "gitpython==3.1.45",
  "hf-xet==1.1.10",
  "huggingface-hub==0.34.4",
  "idna==3.10",
  "iniconfig==2.1.0",
  "ipdb==0.13.13",
  "ipython==9.5.0",
  "ipython-pygments-lexers==1.1.1",
  "jedi==0.19.2",
  "jinja2==3.1.6",
  "joblib==1.5.3",
  "jsonschema==4.25.1",
  "jsonschema-specifications==2025.9.1",
  "lightning-utilities==0.15.2",
  "markupsafe==3.0.2",
  "matplotlib-inline==0.1.7",
  "meds-testing-helpers==0.3.0",
  "mpmath==1.3.0",
  "multidict==6.6.4",
  "nested-ragged-tensors==0.1",
  "networkx==3.5",
  "nvidia-cublas-cu12==12.8.4.1",
  "nvidia-cuda-cupti-cu12==12.8.90",
  "nvidia-cuda-nvrtc-cu12==12.8.93",
  "nvidia-cuda-runtime-cu12==12.8.90",
  "nvidia-cudnn-cu12==9.10.2.21",
  "nvidia-cufft-cu12==11.3.3.83",
  "nvidia-cufile-cu12==1.13.1.3",
  "nvidia-curand-cu12==10.3.9.90",
  "nvidia-cusolver-cu12==11.7.3.90",
  "nvidia-cusparse-cu12==12.5.8.93",
  "nvidia-cusparselt-cu12==0.7.1",
  "nvidia-nccl-cu12==2.27.3",
  "nvidia-nvjitlink-cu12==12.8.93",
