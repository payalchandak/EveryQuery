[build-system]
requires = ["setuptools>=80.9.0", "setuptools-scm>=9.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "EveryQuery"
dynamic = ["version"] # Makes setuptools-scm manage the version
authors = [
  {name="Payal Chandak", email="payal.chandak@gmail.com"},
  {name="Matthew McDermott", email="mattmcdermott8@gmail.com"},
  {name="Gregory Kondas", email="gregkondas9@gmail.com"},
]
description = "A framework for training and evaluating foundation models, using the MEDS ecosystem for data processing and PyTorch Lightning for training."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License", # Change if not using MIT license
    "Operating System :: OS Independent",
]
dependencies = [
  # Upper bounds are set at the next major version for every library that follows semver —
  # this is the loosest range we can ship without relying on a not-yet-released major being
  # backwards-compatible.  Tighter ranges (`meds-torch-data ~=0.9.0`) are upstream-opinionated
  # pre-1.0 libraries whose minor bumps have been breaking in practice.  Lower bounds are the
  # oldest version that exposes the APIs EveryQuery actually uses; where that's hard to verify
  # cheaply, we anchor at the version that was shipping when the dep was first added.
  "polars>=1.35,<2",
  "pyarrow>=17,<22",
  "hydra-core>=1.3,<2",
  "numpy>=2,<3",
  "meds>=0.4,<0.5",
  "filelock>=3.13,<4",
  "pytest>=8,<9",
  "meds-transforms>=0.6.7,<0.7",
  "hydra-joblib-launcher>=1.2,<2", # parallel preprocessing workers (_parallel_runner.yaml)
  "meds-torch-data[lightning]~=0.9.0",
  "transformers>=4.48,<5",
  "torch>=2.6,<3",
  "torchdata>=0.8,<1", # StatefulDataLoader for mid-epoch train resume
  "torchmetrics>=1.4,<2",
  # >=2.5: fit loop snapshots/restores stateful dataloaders (mid-epoch resume)
  "lightning>=2.5,<3",
  "wandb>=0.22.3,<1",
  "ipykernel>=7.2,<8",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.9,<4",
] # Add your runtime dependencies here

[dependency-groups]
dev = [
  "pre-commit<4",
  "ruff",
  "pytest",
  "pytest-cov",
  "pretty-print-directory",
  # Pinned to 0.3.0 because 0.3.1 switches the simple_static fixture's birth code
  # from `DOB` to `MEDS_BIRTH`, which breaks `tests/test_predict_cli.py::_QUERY_CODES`
  # without a code change.  Revisit once the fixture stabilises upstream.
  "meds_testing_helpers==0.3.0",
  "yaml_to_disk",
  "hydra-submitit-launcher>=1.2.0",
] # Add your development (lint, test) dependencies here
docs = [] # Add your documentation dependencies here (I recommend mkdocs-material)

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
every_query = ["**/*.yaml"]

[tool.setuptools_scm] # Required for setuptools-scm to work, even if empty

[project.optional-dependencies] # Add any optional dependencies here, installable via `pip install .[extra]`

[project.scripts]
EQ_process_data = "every_query.preprocessing.__main__:main"
EQ_generate_training_tasks = "every_query.generate_tasks.sample_tasks:main"
EQ_generate_evaluation_tasks = "every_query.generate_tasks.sample_evaluation_tasks:main"
EQ_sample_task_tracking_pairs = "every_query.generate_tasks.sample_task_tracking_pairs:main"
EQ_train = "every_query.train.train:main"
EQ_predict = "every_query.predict.predict:main"
# EQ_evaluate points at the single-stage evaluator (consumes a PredictionSchema
# parquet, emits per-(query, duration_days) metrics).  The legacy four-stage
# evaluator (every_query.evaluate.eval + siblings, and its sibling CLIs
# EQ_gen_eval_index / EQ_gen_eval_tasks / EQ_select_model) has been deleted per
# the #83 consolidation wave; recover from git history if needed.
EQ_evaluate = "every_query.evaluate.evaluate:main"
# No EQ_generate_query_sequences: every_query.generate_tasks.query_sequence_labeling is a library
# now, not a CLI.  Its labellers are the shared seam under the evaluation-grid generator, the
# multitask sampler's prediction-time resolver and the multitask labeller's correctness oracle; its
# Hydra `run`/`main` survive only as the differential test's training-pipeline arm.
# All-vocabulary multi-bound multitask sampler (#20): K boundaries per context, one packed target bit
# per base-vocabulary code per boundary, written as row-aligned `<shard>.labels.npy` sidecars.
EQ_generate_multitask_sequences = "every_query.generate_tasks.sample_multitask_sequences:main"
# Builds the code-ontology DAG artifacts (nodes/mix/closure parquets) that ancestor queries and
# ontology-mixed embeddings read.  Side-car: the cohort's codes.parquet is read, never written.
EQ_build_ontology = "every_query.data.build_ontology:main"
# The evaluation-grid generator for the multitask model: labels the same N query sequences
# (optionally with explicit window starts, #27) at every context of a sampled or supplied cohort,
# as QuerySeqSchema parquets.  Consumed by EQ_predict_multitask.
EQ_generate_evaluation_query_sequences = "every_query.generate_tasks.sample_evaluation_query_sequences:main"
# Inference over that grid with the multitask model: one scalar final-query probability per grid
# row, target-only (#28); no packed labels, manifest or sidecar are read.
EQ_predict_multitask = "every_query.predict.predict_multitask:main"
# Metrics over that same grid: groups the EQ_predict_multitask rows by task (the five window list
# columns plus answers[:-1]) and scores each task's final-query probability against its final-query
# answer: one AUROC per task with a 95% row-bootstrap CI.
EQ_evaluate_multitask = "every_query.evaluate.evaluate_multitask:main"

[tool.coverage.run]
# Measure coverage for EQ_* CLIs launched via subprocess in tests/test_cli_smoke.py.
# coverage's `patch = ["subprocess"]` replaces the removed pytest-cov 7.0 subprocess hook
# and implies parallel=true.  See
# https://pytest-cov.readthedocs.io/en/latest/subprocess-support.html
patch = ["subprocess"]

[tool.pytest.ini_options] # Default pytest options
# Put *this* checkout's `src` ahead of the editable install on `sys.path`.
#
# The editable install is a plain `.pth` naming one absolute path — the main checkout's `src`.
# A `git worktree` shares that venv, so `pytest` launched from a worktree imported `every_query`
# from the *main* checkout and silently tested a different branch's code: green runs that proved
# nothing about the branch under test, and mutation-testing runs that reported a mutation
# "caught" when the mutated file was never imported.  Nothing about that failure is visible in
# the output — the suite passes either way — which is the same silent-wrong-answer shape as the
# defects this branch exists to fix.
pythonpath = ["src"]
addopts = [
  "--color=yes",
  "--doctest-modules", # Ensures that doctest runs
  "--ignore=docs",
  # No `--ignore=scripts`.  That exclusion existed for a directory of one-off conditional-model
  # eval/report builders with hardcoded run paths and optional deps (reportlab), where a
  # collection-time import was a liability rather than a check — and it is what hid several of
  # them sitting broken behind stale `every_query` imports across the sampler redesign.  All of
  # them are gone; `scripts/` now holds only `bench_multitask_dataset.py`, an ordinary driver
  # over a shipped dataset class with no optional deps, so letting `--doctest-modules` import it
  # is the check rather than the liability.  `tests/test_cli_smoke.py::test_script_imports` still
  # covers it explicitly, because CI's `pytest -v` collects the rootdir but a `pytest tests/` run
  # would not reach `scripts/` at all.
  "--ignore=AGENTS.md",
  "--ignore=CONTRIBUTORS.md",
  "--doctest-glob=*.md",
  "-m",
  "not slow", # Skip slow integration tests by default; opt-in via `-m slow` or `-m "slow or not slow"`.
]
markers = [
  "slow: heavy integration tests that train a real model (~5 min CI, ~5-7 min laptop). Skipped by default; run with `pytest -m slow` or `pytest -m 'slow or not slow'` to include.",
]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[project.urls]
Homepage = "https://github.com/payalchandak/EveryQuery"
Issues = "https://github.com/payalchandak/EveryQuery/issues"

[tool.ruff] # Ruff configuration for linting and formatting
target-version = "py311"
line-length = 110
# `scripts/` was excluded because it held the conditional-model research drivers, ported verbatim
# from the fork with ~200 pre-existing findings that `ruff format` would have rewritten wholesale,
# turning every future edit to a script into a red build unrelated to the edit.  Those drivers are
# deleted; the one remaining script is lint-clean, so the exclusion is dropped rather than left as
# a licence for the next one to arrive dirty.
extend-exclude = ["docs/index.md"]

# Enable linters
[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "N",   # pep8-naming
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__ files
"test_*" = ["DTZ001"]  # Ignore datetimez in test files
"*.ipynb" = ["E402"]  # Notebooks have imports spread across cells

[tool.ruff.lint.pep8-naming]
# B/S/H join the existing D/M/L: single-capital tensor-shape locals (batch, sequence, hidden),
# the conventional notation in the model and dataset code.
extend-ignore-names = ["*MEDS*", "*NRT*", "D", "M", "L", "LR*", "B", "S", "H"]
