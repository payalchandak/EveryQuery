name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run_tests_ubuntu:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # Job budget = the training-validity subprocess ceiling (1800s / 30min) + setup +
    # the rest of the suite.  Observed slow-test wall time on ubuntu-latest is ~5min, so
    # 45min leaves huge slack — we keep it wide rather than tight because the subprocess
    # ceiling itself is 30min and we want room above that for unusually-slow runners.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup package
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        # `-m "slow or not slow"` opts in to the slow-marked integration tests (e.g. the
        # training-validity test in tests/training_validity/) which pyproject.toml's default
        # addopts `-m "not slow"` skips for local development.  CI runs the full set.
        run: >
          uv run pytest -v
          -m "slow or not slow"
          --ignore=docs
          --cov=src
          --cov-report=xml:coverage.xml
          --cov-report=term
          --junitxml=junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # codecov/codecov-action@v4.0.1 pinned exact produced intermittent EPIPE errors on
          # the gpg-verification subprocess when Codecov's CDN throttled the uploader binary.
          # v5 uses the new Codecov CLI (no embedded gpg) and the floating major-tag gives us
          # patch-level fixes without a second pin-bump PR every time.
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
