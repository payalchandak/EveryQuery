# Shared submitit launcher for single-GPU jobs: EQ_predict.
#
# NOT for EQ_train — multi-GPU DDP training stays on the plain `sbatch
# scripts/train_eq.sh` path so Lightning gets the srun-wrapped task launch
# it expects.
#
# Usage (from login node):
#   EQ_predict -m \
#     --config-dir=configs \
#     hydra/launcher=gpu_single \
#     <predict overrides>

defaults:
  - override /hydra/launcher: submitit_slurm

hydra:
  launcher:
    partition: gpu
    gres: gpu:1
    timeout_min: 360
    cpus_per_task: 4
    mem_gb: 64
    tasks_per_node: 1
    nodes: 1
    array_parallelism: 4
    additional_parameters:
      mail-user: gbk2114@cumc.columbia.edu
      mail-type: END,FAIL
