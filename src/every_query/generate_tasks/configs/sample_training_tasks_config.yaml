# Hydra config for the redesigned training-task sampler (5-stage pipeline; see
# `redesign-spec.md`).  This is the redesign's input surface (issue #203) and is wired in by the
# later stage issues (#205-#210).
#
# Path roots are machine-specific, required Hydra args (no `.env`/env-var fallback — see #235).
# Pass them on the CLI, typically as shell-expanded vars (`data_dir=$TOKENIZED_EVENTS_DIR out_dir=$TRAINING_TASKS_DIR`):
#   path_to_data (data_dir)       (event shards under `{path_to_data}/data/{split}/*.parquet`)
#   training_tasks_dir (out_dir)  (final dataset only: `{split}/{shard}.parquet`)
# Both are `???` (mandatory); leaving one unset raises OmegaConf's MissingMandatoryValue.  The
# intermediate-artifacts root has no key of its own: it is always the sibling `{parent}/{name}_artifacts`
# of training_tasks_dir, so the two trees never nest (invariant 7).

# Sampling budget.
num_queries: 1024
num_contexts_per_query: 1

# Minimum prior *prediction times* (distinct (subject_id, time) rows, NOT events) required before
# a prediction time is eligible.  Governs Stage 0 eligibility and the Stage 2 draw range.
# Supersedes the legacy event-based `min_context_per_subject`.
min_prediction_times_per_subject: 50

# Optional cap on the Stage 4 worker pool; null => resolve_workers() uses cores-on-node, an
# explicit int caps that result downward only.  Supersedes the legacy `num_workers` knob.
max_workers: null

# Query-code sampling universe (required).  Pass an explicit Hydra list (`query_codes=[HR,TEMP]`),
# a YAML/parquet path, or a metadata root directory to load the full vocabulary from
# `{dir}/metadata/codes.parquet` (typically `query_codes=$TENSORIZED_COHORT_DIR`).  Resolved by
# `read_query_codes` outside `QueryDistribution`.
query_codes: ???

# Duration draw (Stage 1 / QueryDistribution).  `duration_days` is a float (no day-rounding).
min_duration: 1
max_duration: 731
duration_distribution: log-uniform # uniform | log-uniform

# Path roots (see header): required Hydra args, no env fallback.  Pass `data_dir=$TOKENIZED_EVENTS_DIR out_dir=$TRAINING_TASKS_DIR`.
data_dir: ???
out_dir: ???

split: train
seed: 1
overwrite: false

hydra:
  output_subdir: null
  job:
    chdir: false
