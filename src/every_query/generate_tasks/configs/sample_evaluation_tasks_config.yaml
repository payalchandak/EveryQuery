# Hydra config for the evaluation-task label generator.
#
# Sibling to the training-task generator (pretraining-shape, scattered tasks).  Where
# `sample_tasks` draws random (code, duration) per row, this endpoint samples K
# prediction times per subject and cross-joins them with the full (codes x durations)
# grid — the dense shape `EQ_evaluate` needs to compute per-(query, duration_days)
# metrics over a split.
#
# Sweep across shards with:
#   python -m every_query.generate_tasks.sample_evaluation_tasks -m input_shard=0,1,2,...
#
# Path roots are required Hydra args (no `.env`/env-var fallback — see #235).  Pass them on the
# CLI, typically as shell-expanded vars (`data_dir=$TOKENIZED_EVENTS_DIR out_dir=$EVAL_TASKS_DIR`):
#   data_dir  (event shards live under `{data_dir}/data/{split}/*.parquet`)
#   out_dir   (labeled shards land at {out_dir}/eval/{split}/*.parquet — separate `eval/` subdir
#             so they don't collide with `sample_tasks`'s pretraining outputs at {out_dir}/{split}/*)

data_dir: ???
out_dir: ???

split: held_out # typical inference split; use `tuning` for intermediate validation.
input_shard: "0" # basename (without .parquet) of the MEDS shard for this worker.
seed: 1

# How many prediction times to sample per subject.  The dense grid is
# `prediction_times_per_subject x len(codes) x len(durations)` rows per subject.
prediction_times_per_subject: 1

# Minimum prior events a subject must have accumulated before a prediction time is
# valid.  (Event-based; the redesigned training sampler instead gates on
# `min_prediction_times_per_subject`.)
min_context_per_subject: 50

# Codes to evaluate (required).  Either an explicit list (`query_codes=[HR, TEMP]`), a YAML/parquet
# path, or a metadata root directory to load the full vocabulary from `{dir}/metadata/codes.parquet`
# (typically `query_codes=$TENSORIZED_COHORT_DIR`).
query_codes: ???

# Duration-day horizons to evaluate at every prediction time.  Must be a list of
# ints; no log-uniform sampling here (unlike `sample_tasks`) — evaluation wants a
# fixed, caller-specified duration grid.
durations: [30, 90, 180, 365, 731]

# Optional subject subsample.  When set to a float in (0, 1], each worker
# applies a deterministic per-subject hash-threshold filter so each unique
# subject ID is independently kept with probability ~= the fraction.  Because
# the threshold is per-subject (not a per-shard quota), the expected fraction
# is honored regardless of shard size — small shards do not get rounded up
# to one retained subject.  Subject IDs are disjoint across shards, so this
# is also a uniform global subsample.  Values outside (0, 1] or non-finite
# values raise ValueError.  Leave as null to disable.
subject_subsample_fraction: null

# Also emit a deduped (subject_id, prediction_time) parquet under
# {out_dir}/eval_unique/{split}/{shard}.parquet — the input shape MEDS_EIC_AR's
# trajectory-generation baseline expects (one trajectory per prediction time,
# not one per (code, duration) pair). Computed after the censor filter.
write_unique_prediction_times: true

overwrite: false

hydra:
  output_subdir: null
  job:
    chdir: false
