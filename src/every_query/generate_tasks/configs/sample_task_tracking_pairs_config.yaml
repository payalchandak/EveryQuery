# Hydra config for the per-task AUROC tracking-pair sampler.
#
# Consumes the dense per-shard label parquets written by `EQ_generate_evaluation_tasks`
# (point `eval_labels_dir` at that command's `{out_dir}/eval` root, typically generated
# with `split=tuning`) and samples up to `n_per_class` positive + negative labeled rows
# per `(query, duration_days)` task into a single compact parquet. That parquet is small
# enough to be read every validation pass by the training-time
# `TaskAurocTrackingCallback`, giving a cheap unbiased estimate of per-task AUROC
# without scoring the whole tuning split.
#
# Usage:
#   EQ_sample_task_tracking_pairs \
#       eval_labels_dir=$EVAL_TASKS_DIR/eval out_dir=$TASK_TRACKING_DIR split=tuning

eval_labels_dir: ??? # {eval_labels_dir}/{split}/*.parquet must exist (from EQ_generate_evaluation_tasks)
out_dir: ??? # pairs land at {out_dir}/{split}/0.parquet

split: tuning
seed: 1
n_per_class: 20 # max positive and negative rows kept per task
overwrite: false

hydra:
  output_subdir: null
  job:
    chdir: false
