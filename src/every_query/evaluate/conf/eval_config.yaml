defaults:
  - _self_
  - eval_codes: 10000_ID__8db2be6fadf8

# List of training run directories.  Required override — supply from the CLI, e.g.
#   EQ_evaluate model_run_dirs=[${oc.env:OUTPUT_DIR}/outputs/YYYY-MM-DD/HH-MM-SS/]
# Paths are typically rooted at $OUTPUT_DIR so they move with .env across machines.
model_run_dirs: ???

#
# Checkpoints to evaluate within each run dir (names without .ckpt extension)
# Set to null to just use ckpt_path (single checkpoint)
ckpt_names:
  # - "best"
  # - "epoch=0-step=1382"
  # - "epoch=0-step=4146"
  # - "epoch=0-step=6911"
  # - "epoch=0-step=11058"

# Durations (in days) to evaluate at; This must be a list!
durations: [30, 90, 180, 365, 731]

index_time_hash: 7573f855c4b050a9d79d57fefd8a139c
split: held_out
# task_set_dir should point to gen_task.py output: out_root_dir/{index_hash}/{split}
# which contains {duration}/{code_slug}/ subdirectories
task_set_dir: ${oc.env:TASK_DIR}/eval/tasks_from_index_new/${index_time_hash}/${split}
ckpt_path: best

# Random Codes (queries) to eval
id_codes: ${eval_codes.id}
ood_codes: ${eval_codes.ood}
# Hand selected codes to eval model on
manual_codes: [MEDS_DEATH]
# eval outputs are written to {model_run_dir}/eval/{ckpt_name}/

do_overwrite: false
do_resume: false
seed: 140799
mode: predict
