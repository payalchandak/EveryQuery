# Hydra config for the sampling-first task label generator.
#
# Sweep on the cluster with:
#   python -m every_query.sample_tasks -m input_shard=0,1,2,... task_shard=range(0,K)
#
# Path roots are left as `null` in this file and resolved inside `main()` via `load_dotenv()` +
# env-var fallback, matching the repo convention where `.env` holds machine-specific paths
# (see `.env.example`, `tasks.py`, and `_env.py`).  Fallbacks:
#   data_dir  -> $INTERMEDIATE   (event shards live under `{data_dir}/data/{split}/*.parquet`)
#   codes_dir -> $PROCESSED      (query universe lives under `{codes_dir}/metadata/codes.parquet`)
#   out_dir   -> $TASK_DIR       (labeled shards and _artifacts/ land here)
# Tests can inject values directly with `data_dir=/path out_dir=/path codes_dir=/path`.

data_dir: null
codes_dir: null
out_dir: null

split: train
input_shard: "0" # basename (without .parquet) of the MEDS shard for this worker
task_shard: 0 # slice of the task/context axis; vary this under `-m` to cover the task space
seed: 1

# Per-worker sampling budget.
n_tasks: 1024
contexts_per_task: 1

# Task distribution bounds.
duration_min: 1
duration_max: 731

# Minimum prior events a subject must have accumulated before a prediction time is valid.
min_context_per_subject: 50

overwrite: false

hydra:
  output_subdir: null
  job:
    chdir: false
