defaults:
  - _self_

io:
  # where your existing task shards live (expects all/{split}/*.parquet)
  task_dir: ${oc.env:TASK_DIR}

  # stable artifact root (NOT hydra outputs/)
  out_root: ${oc.env:TASK_DIR}/eval/

sampling:
  splits: ["tuning"]
  sample_times_per_subject: 1

  # deterministic shuffle seed
  seed: 42

behavior:
  skip_existing: true
