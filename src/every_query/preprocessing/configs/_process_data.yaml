input_dir: ???
intermediate_dir: ???
output_dir: ???

log_dir: ${output_dir}/.logs

do_reshard: False
do_demo: False
# Fold categorical text values into codes (the ``fuse_text_values`` stage); the stage is also skipped
# automatically when the input has no ``text_value`` column.
do_fuse_text_values: True

# Optional path to a MEDS-Transforms stage runner YAML (e.g. with a `parallelize` block);
# null runs every stage single-worker.
stage_runner_fp: null

hydra:
  run:
    dir: "${log_dir}"
  output_subdir: null
  job:
    chdir: false
