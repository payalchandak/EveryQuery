# Imminent ICU mortality
#
# Clinical question:
#   Given any event during an ICU stay, and restricting to cases where the patient is not
#   discharged alive from the hospital within the next 24 hours, will they die within
#   those 24 hours?
#
# Trigger:         every event during an open ICU stay.
# Prediction time: the triggering event (`input.index_timestamp: end`).
# Label:           `death` in the `target` window.
# Cohort:          ICU stay still open at trigger, patient still alive, and no live
#                  hospital discharge in the 24h horizon.
#
# `hospital_discharge` enumerates the live dispositions rather than matching every
# discharge.  The gate exists to drop triggers censored by the patient leaving, so it must
# not fire on the discharge record that accompanies a death, which would delete exactly
# the rows where the outcome occurred.

predicates:
  icu_admission:
    code: ICU_ADMISSION
  icu_discharge:
    code: ICU_DISCHARGE
  hospital_discharge:
    code:
      any:
        - HOSPITAL_DISCHARGE//HOME
        - HOSPITAL_DISCHARGE//SNF
        - HOSPITAL_DISCHARGE//REHAB
        - HOSPITAL_DISCHARGE//LTACH
        - HOSPITAL_DISCHARGE//AMA
  death:
    code: DEATH

trigger: _ANY_EVENT

windows:
  icu_context:
    start: end <- icu_admission
    end: trigger
    start_inclusive: true
    end_inclusive: true
    has:
      icu_discharge: (None, 0)
      death: (None, 0)

  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    has:
      _ANY_EVENT: (10, None)
    index_timestamp: end

  target:
    start: trigger
    end: start + 24h
    start_inclusive: false
    end_inclusive: true
    has:
      hospital_discharge: (None, 0)
    label: death
