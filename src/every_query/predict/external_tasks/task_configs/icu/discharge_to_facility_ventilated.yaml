# Discharge to a facility while ventilated
#
# Clinical question:
#   Given any event while a patient is receiving ventilation in the ICU, will the
#   ventilation episode end with discharge to a facility while still ventilated, rather
#   than with extubation, death, or discharge home?
#
# Trigger:         every event during an open ICU stay and an open ventilation episode.
# Prediction time: the triggering event (`input.index_timestamp: end`).
# Label:           `discharge_to_facility` in the `target` window, which runs to whichever
#                  episode endpoint comes first (`episode_end` = extubation, any hospital
#                  discharge, or death).
# Cohort:          ventilation episode still open at trigger, meaning none of the three
#                  `episode_end` events has happened yet.
#
# `vent_context` bars every arm of `episode_end`, not just extubation.  ACES resolves `->`
# by scanning forward from the anchor row inclusive, so a trigger that is itself an
# endpoint would make `target` match that same row and collapse to a zero-length window,
# scoring a facility discharge as a negative.  Barring all three arms keeps the endpoint
# strictly in the future of every prediction time.

predicates:
  icu_admission:
    code: ICU_ADMISSION
  icu_discharge:
    code: ICU_DISCHARGE
  intubation:
    code: INTUBATION
  extubation:
    code: EXTUBATION
  death:
    code: DEATH
  hospital_discharge:
    code: { regex: "^HOSPITAL_DISCHARGE//.*" }
  discharge_to_facility:
    code:
      any:
        - HOSPITAL_DISCHARGE//SNF
        - HOSPITAL_DISCHARGE//LTACH
        - HOSPITAL_DISCHARGE//REHAB
  episode_end:
    expr: or(extubation, hospital_discharge, death)

trigger: _ANY_EVENT

windows:
  icu_context:
    start: end <- icu_admission
    end: trigger
    start_inclusive: true
    end_inclusive: true
    has:
      icu_discharge: (None, 0)

  vent_context:
    start: end <- intubation
    end: trigger
    start_inclusive: true
    end_inclusive: true
    has:
      extubation: (None, 0)
      hospital_discharge: (None, 0)
      death: (None, 0)

  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    has:
      _ANY_EVENT: (10, None)
    index_timestamp: end

  target:
    start: trigger
    end: start -> episode_end
    start_inclusive: false
    end_inclusive: true
    label: discharge_to_facility
