# Imminent hypoglycemia
#
# Clinical question:
#   Given any event during an ICU stay, and restricting to cases where the patient is not
#   discharged from the hospital within the next 12 hours, will any glucose below
#   70 mg/dL be charted within those 12 hours?
#
# Trigger:         every event during an open ICU stay.
# Prediction time: the triggering event (`input.index_timestamp: end`).
# Label:           `glucose_low` in the `target` window.
# Cohort:          ICU stay still open at trigger, no hospital discharge in the 12h horizon.

predicates:
  icu_admission:
    code: ICU_ADMISSION
  icu_discharge:
    code: ICU_DISCHARGE
  hospital_discharge:
    code: HOSPITAL_DISCHARGE
  glucose:
    code: { any: [LAB//50931, LAB//50809, LAB//225664] }
  glucose_low:
    code: { any: [LAB//50931, LAB//50809, LAB//225664] }
    value_max: 70
    value_max_inclusive: false

trigger: _ANY_EVENT

windows:
  icu_context:
    start: end <- icu_admission
    end: trigger
    start_inclusive: true
    end_inclusive: true
    has:
      icu_discharge: (None, 0)

  input:
    start: null
    end: trigger
    start_inclusive: true
    end_inclusive: true
    has:
      _ANY_EVENT: (10, None)
    index_timestamp: end

  target:
    start: trigger
    end: start + 12h
    start_inclusive: false
    end_inclusive: true
    has:
      hospital_discharge: (None, 0)
    label: glucose_low
