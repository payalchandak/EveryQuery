# EQ_predict — inference-only entry point.
#
# Reads all TaskQuerySchema-conformant parquets under tasks_dir, runs the trained
# model's predict_step per row, writes a PredictionSchema-conformant parquet.  See
# src/every_query/predict/predict.py and the design-doc comment on #81 for the full
# contract.

defaults:
  - _self_

# Required: path to a training run directory containing best_model.ckpt +
# resolved_config.yaml (the pattern EveryQuery's train.py writes).
model_run_dir: ???

# Required: path to a directory of TaskQuerySchema-conformant parquet files
# (subject_id, prediction_time, query, duration_days; inherited label columns
# optional).  Every file under this directory is passed to the dataset — callers
# should provide a clean directory containing only task parquets.  Ideally a
# single parquet file sits in the dir.
tasks_dir: ???

# Required: path to write the output parquet.  Conforms to
# every_query.predict.schema.PredictionSchema (TaskQuerySchema + censor_prob + occurs_prob;
# see #129 for the post-refactor occurs_prob → label_prob generalization discussion).
output_parquet: ???

# Optional: pick a specific checkpoint name under model_run_dir/checkpoints/.
# If null, falls back to best_model.ckpt then checkpoints/last.ckpt.
ckpt_name: null

# Optional: which tensorized-cohort split to predict on.  Must be "held_out" (typical
# inference — unseen data) or "tuning" (intermediate validation during model
# development — the training-validity E2E uses this).  "train" is disallowed: MTD's
# train_dataloader shuffles, which would break the order-preserving hstack.
split: held_out

# Optional: overwrite ``output_parquet`` if it already exists.  Default false so an
# existing predictions file is never silently clobbered — re-running against the
# same output path without this flag raises ``FileExistsError`` at startup.
overwrite: false

# Optional: also write per-row pooled query embeddings to a sibling parquet at
# ``<output_parquet stem>.embeddings.parquet`` (e.g. ``predictions.parquet`` →
# ``predictions.embeddings.parquet``).  The sibling carries the same TaskQuerySchema
# identifiers as the predictions file plus a single ``embedding`` column of
# ``fixed_size_list<float32>[hidden_size]``.  Default false.  Subject to the same
# ``overwrite`` guard as ``output_parquet`` — re-running without ``overwrite=true``
# raises ``FileExistsError`` at startup if the sibling already exists.
save_embeddings: false

# Optional: override the dataloader batch size for inference.  Defaults to null,
# which reuses the training run's ``datamodule.batch_size`` (typically 128).
# Inference is forward-only with no gradients, so larger batches (e.g. 4–8x
# training) usually fit on the same GPU and improve throughput.  Does not touch
# the saved training ``resolved_config.yaml``.
batch_size: null

# Optional: override the dataloader worker count for inference.  Defaults to null,
# which reuses the training run's ``datamodule.num_workers`` (typically 1).  With
# large task frames a single worker starves the GPU building per-row sequences;
# raising this (e.g. to the SLURM cpus-per-task) is usually the biggest throughput
# win.  Does not touch the saved training ``resolved_config.yaml``.
num_workers: null

hydra:
  output_subdir: null
  job:
    chdir: false
