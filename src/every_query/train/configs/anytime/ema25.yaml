# @package _global_
#
# Anytime Pretraining (issue #315): AdamW at the same peak LR, a fixed-length warmup, then a
# horizon-free LR (constant by default), plus an EMA of the weights whose half-life grows as
# step / 25.  Validation, checkpoint selection, early stopping and EQ_predict(_multitask) all use
# the EMA weights; the raw weights and optimizer state stay in the checkpoint so a run can be
# resumed and extended (raise trainer.max_epochs, or trainer.max_epochs=-1 with a larger
# trainer.max_steps) without a schedule restart.  See train/README.md.
#
#   EQ_train +anytime=ema25                                  # constant LR + EMA-25
#   EQ_train +anytime=ema25 lr_scheduler=inverse_sqrt        # 1/sqrt(t) LR + EMA-25
#   EQ_train +anytime=ema25 trainer.callbacks.anytime_ema=null  # constant LR, raw weights (ablation)
defaults:
  - override /lr_scheduler: constant

lightning_module:
  warmup_ratio: 0.0
  # Fixed in optimizer steps so the schedule never depends on the run's length.  Lower it for short
  # runs (fast_config trains 400 steps); for an A/B against cosine, match the baseline's logged
  # LR_scheduler/num_warmup_steps.
  warmup_steps: 2000

trainer:
  callbacks:
    anytime_ema:
      _target_: every_query.model.anytime_ema.AnytimeEMA
      k: 25.0
